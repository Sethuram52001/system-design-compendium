syntax = "proto3";

package userpb;

option go_package = "github.com/Sethuram52001/system-design-compendium/networking/exercises/grpc/solution/proto/userpb";

message User {
    string id = 1;
    string name = 2;
    string email = 3;
    int32 age = 4;
}

message GetUserRequest {
    string id = 1;
}

message GetUserResponse {
    User user = 1;
}

service UserService {
    rpc GetUser(GetUserRequest) returns (GetUserResponse);
}
